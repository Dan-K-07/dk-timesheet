<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK Timesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0E4;
    --panel: #FFFFFF;
    --panel-2: #FBF7EE;
    --ink: #262220;
    --ink-dim: #746C60;
    --line: #E3D9C3;
    --accent: #B8631E;
    --accent-ink: #FFFFFF;
    --warehouse: #3E6C99;
    --warehouse-bg: #E3EAF2;
    --onsite: #B8631E;
    --onsite-bg: #F5E4D2;
    --holiday: #3F8F70;
    --holiday-bg: #DFEFE7;
    --sick: #A5424B;
    --sick-bg: #F3DEE0;
    --off: #7A7468;
    --off-bg: #EAE5D9;
    --danger: #A5424B;
    --shadow: 0 1px 2px rgba(40,30,10,0.08), 0 4px 14px rgba(40,30,10,0.06);
    --radius-card: 3px;
    --radius-tag: 2px;
    --font-ui: 'Barlow', system-ui, sans-serif;
    --font-head: 'Barlow Semi Condensed', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1C1E;
      --panel: #232527;
      --panel-2: #2A2C2F;
      --ink: #ECE7DC;
      --ink-dim: #9B958A;
      --line: #37393C;
      --accent: #E3A438;
      --accent-ink: #241A06;
      --warehouse: #7CA3D4;
      --warehouse-bg: #26313F;
      --onsite: #E3A438;
      --onsite-bg: #3B2E15;
      --holiday: #62C6A0;
      --holiday-bg: #1D3A31;
      --sick: #E08A90;
      --sick-bg: #3A2124;
      --off: #9B958A;
      --off-bg: #2E2F30;
      --danger: #E08A90;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1C1E;
    --panel: #232527;
    --panel-2: #2A2C2F;
    --ink: #ECE7DC;
    --ink-dim: #9B958A;
    --line: #37393C;
    --accent: #E3A438;
    --accent-ink: #241A06;
    --warehouse: #7CA3D4;
    --warehouse-bg: #26313F;
    --onsite: #E3A438;
    --onsite-bg: #3B2E15;
    --holiday: #62C6A0;
    --holiday-bg: #1D3A31;
    --sick: #E08A90;
    --sick-bg: #3A2124;
    --off: #9B958A;
    --off-bg: #2E2F30;
    --danger: #E08A90;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 980px; margin: 0 auto; padding: 0 16px 64px; }

  a { color: var(--accent); }
  button { font-family: var(--font-ui); cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0 14px; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark {
    font-family: var(--font-head); font-weight: 700; font-size: 22px;
    letter-spacing: 0.01em;
  }
  .brand .mark span { color: var(--accent); }
  .brand .sub { font-size: 12.5px; color: var(--ink-dim); font-family: var(--font-mono); }

  .theme-toggle {
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: var(--radius-tag); padding: 6px 10px; font-size: 13px;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--ink-dim); }

  .header-actions { display: flex; gap: 8px; align-items: center; }
  .sync-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: var(--radius-tag); padding: 6px 10px; font-size: 13px;
  }
  .sync-btn:hover { color: var(--ink); border-color: var(--ink-dim); }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
  .sync-dot.off { background: var(--ink-dim); }
  .sync-dot.connecting, .sync-dot.syncing { background: var(--onsite); animation: pulse 1.2s ease-in-out infinite; }
  .sync-dot.synced { background: var(--holiday); }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .gate-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .gate-card { width: 100%; max-width: 320px; padding: 30px 26px; text-align: center; }
  .gate-mark { font-family: var(--font-head); font-weight: 700; font-size: 24px; margin-bottom: 4px; }
  .gate-mark span { color: var(--accent); }
  .gate-sub { font-size: 13px; color: var(--ink-dim); margin-bottom: 18px; }
  .gate-input {
    width: 100%; text-align: center; font-family: var(--font-mono); font-size: 18px;
    letter-spacing: 0.15em; padding: 11px 10px;
  }
  .gate-error { font-size: 12.5px; color: var(--danger); margin-top: 10px; }

  .doc-upload { padding: 16px 18px; margin-bottom: 16px; }
  .doc-upload .form-grid { grid-template-columns: 1fr 1fr; }
  .doc-list-wrap { overflow-x: auto; }
  .doc-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line);
  }
  .doc-row:last-child { border-bottom: none; }
  .doc-icon { font-size: 20px; flex-shrink: 0; width: 26px; text-align: center; }
  .doc-main { flex: 1; min-width: 0; }
  .doc-name { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-meta { font-size: 12px; color: var(--ink-dim); font-family: var(--font-mono); margin-top: 2px; }
  .doc-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .doc-badge {
    display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--ink-dim);
    background: var(--panel-2); border-radius: var(--radius-tag); padding: 1px 6px; margin-left: 6px;
    border: none; cursor: pointer; font-family: var(--font-ui);
  }
  .doc-badge:hover { color: var(--ink); }

  .calc-card { padding: 16px 18px; margin-bottom: 16px; }
  .calc-card .form-grid { grid-template-columns: repeat(3, 1fr); }
  .calc-card select:disabled, .calc-card input:disabled { opacity: 0.5; }

  .tabs {
    display: flex; gap: 2px; border-bottom: 2px solid var(--line); margin-bottom: 20px;
  }
  .tab {
    background: none; border: none; padding: 10px 4px; margin-right: 22px;
    font-family: var(--font-head); font-weight: 600; font-size: 16px;
    color: var(--ink-dim); border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--ink); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: var(--radius-tag); border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 8px 13px;
    font-size: 13.5px; font-weight: 500;
  }
  .btn:hover { border-color: var(--ink-dim); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { border-color: transparent; background: none; }
  .btn-ghost:hover { background: var(--panel-2); }
  .btn-danger { color: var(--danger); }
  .btn-sm { padding: 5px 9px; font-size: 12.5px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-card); box-shadow: var(--shadow);
  }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat-card { padding: 16px 18px; }
  .stat-label { font-size: 12px; color: var(--ink-dim); text-transform: none; margin-bottom: 6px; }
  .stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1.1; }
  .stat-value small { font-size: 14px; font-weight: 500; color: var(--ink-dim); }
  .stat-sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; }

  .section-title {
    font-family: var(--font-head); font-weight: 600; font-size: 15px;
    margin: 26px 0 10px; color: var(--ink);
  }

  /* ---------- Breakdown bars ---------- */
  .breakdown { padding: 16px 18px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-tag {
    width: 92px; flex-shrink: 0; font-size: 12.5px; font-weight: 600;
    padding: 2px 7px; border-radius: var(--radius-tag); text-align: center;
  }
  .bar-track { flex: 1; height: 9px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; }
  .bar-pct { width: 44px; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); }

  .tag { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-tag); white-space: nowrap; }
  .tag-Warehouse { color: var(--warehouse); background: var(--warehouse-bg); }
  .tag-OnSite { color: var(--onsite); background: var(--onsite-bg); }
  .tag-Holiday { color: var(--holiday); background: var(--holiday-bg); }
  .tag-Sick { color: var(--sick); background: var(--sick-bg); }
  .tag-Off { color: var(--off); background: var(--off-bg); }
  .tag-none { color: var(--ink-dim); background: var(--panel-2); }

  /* ---------- Monthly table ---------- */
  table { width: 100%; border-collapse: collapse; }
  .month-table { padding: 4px 0; }
  .month-table table { }
  .month-table th, .month-table td { padding: 9px 14px; text-align: left; font-size: 13.5px; }
  .month-table th { color: var(--ink-dim); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--line); }
  .month-table td { border-bottom: 1px solid var(--line); font-family: var(--font-mono); }
  .month-table td.m-label { font-family: var(--font-ui); font-weight: 500; }
  .month-table tr:last-child td { border-bottom: none; }
  .month-table tr.busiest td { background: var(--onsite-bg); }
  .num { text-align: right; }

  /* ---------- Log toolbar ---------- */
  .log-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .bulk-bar { padding: 10px 14px; margin-bottom: 14px; border-color: var(--accent); font-size: 13.5px; }
  .bulk-bar .btn-row { flex-wrap: wrap; }
  .bulk-bar select { font-size: 13px; }
  .bulk-fields {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .bulk-field-row { display: flex; flex-direction: column; gap: 5px; }
  .bulk-field-check {
    display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-dim); cursor: pointer;
  }
  .bulk-field-row:has(.bulk-field-on:checked) .bulk-field-check { color: var(--ink); font-weight: 500; }
  .bulk-field-row .field-input:disabled { opacity: 0.45; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  select, .field-input {
    font-family: var(--font-ui); font-size: 13.5px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-tag);
    padding: 7px 9px;
  }
  #docFile {
    font-family: var(--font-ui); font-size: 13px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-tag);
    padding: 6px 8px; width: 100%;
  }

  .empty-state {
    text-align: center; padding: 56px 20px; color: var(--ink-dim);
  }
  .empty-state .big { font-family: var(--font-head); font-size: 19px; color: var(--ink); margin-bottom: 6px; }
  .empty-state .btn-row { justify-content: center; margin-top: 16px; }

  /* ---------- Entry form ---------- */
  .entry-form {
    padding: 16px 18px; margin-bottom: 16px; border-color: var(--accent);
  }
  .form-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; margin-bottom: 12px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .field label {
    display: block; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px;
  }
  .field input, .field select { width: 100%; }
  .form-preview { font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); margin-bottom: 12px; }
  .form-preview b { color: var(--ink); font-weight: 600; }

  /* ---------- Data table ---------- */
  .log-table-wrap { overflow-x: auto; }
  .log-table { min-width: 760px; }
  .log-table th {
    text-align: left; font-size: 11.5px; color: var(--ink-dim); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel);
  }
  .log-table td {
    padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle;
  }
  .log-table td.mono, .log-table th.num { font-family: var(--font-mono); }
  .log-table td.num { text-align: right; font-family: var(--font-mono); }
  .log-table tr:hover td { background: var(--panel-2); }
  .log-table .notes-cell { color: var(--ink-dim); font-size: 12.5px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .icon-btn {
    background: none; border: none; color: var(--ink-dim); padding: 4px 6px; border-radius: var(--radius-tag); font-size: 13px;
  }
  .icon-btn:hover { color: var(--ink); background: var(--panel-2); }
  .icon-btn.danger:hover { color: var(--danger); }

  .footnote { font-size: 12px; color: var(--ink-dim); margin-top: 14px; line-height: 1.6; }

  #fileInput { display: none; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--radius-tag);
    font-size: 13.5px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  @media (max-width: 640px) {
    .stat-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: repeat(2, 1fr); }
    .bar-tag { width: 76px; font-size: 11.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls,.csv">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  /* ============ Constants ============ */
  var TYPES = ["Warehouse", "On Site", "Holiday", "Sick", "Off"];
  var TYPE_CLASS = { "Warehouse": "tag-Warehouse", "On Site": "tag-OnSite", "Holiday": "tag-Holiday", "Sick": "tag-Sick", "Off": "tag-Off" };
  var STORAGE_KEY = "dk_timesheet_entries_v1";
  var RATE_KEY = "dk_timesheet_last_rate_v1";
  var THEME_KEY = "dk_timesheet_theme_v1";
  var PIN_KEY = "dk_timesheet_pin_v1";
  var CLIENT_ID_KEY = "dk_timesheet_client_id_v1";
  var SYNC_TABLE = "timesheet_sync";
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // Baked in so every device only ever needs the PIN. The publishable/anon
  // key is meant to be public (it's exposed in any browser using Supabase) —
  // real access control here is the RLS policy on the timesheet_sync table
  // plus the PIN gate below, not secrecy of this value.
  var SUPABASE_URL = "https://axiqpqjquywvzymmzwgr.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_gO1jSR_OETTKmwCz-hEb3w_JUYS1tik";

  /* ============ Downloads capability (falls back to a plain link) ============ */
  var downloadsCap = null;
  (function initDownloads() {
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (cap) { downloadsCap = cap; }).catch(function () {});
    }
  })();
  function offerDownload(blob, filename) {
    if (downloadsCap) {
      downloadsCap.save({ filename: filename, data: blob }).then(function () {
        toast("Saved " + filename);
      }).catch(function (err) {
        if (err && err.code === "declined") return;
        downloadBlob(blob, filename);
      });
      return;
    }
    downloadBlob(blob, filename);
  }

  /* ============ State ============ */
  var state = {
    tab: "summary",
    entries: [],
    editingId: null,
    adding: false,
    filterType: "",
    filterMonth: "",
    sortDir: "desc",
    lastRate: null,
    theme: null,
    summaryFrom: "",
    summaryTo: "",
    authed: false,
    pin: null,
    pinAttempting: false,
    gateError: "",
    syncStatus: "off",
    lastSynced: null,
    selectedIds: {},
    bulkEditOpen: false,
    documents: [],
    docFilterDate: "",
    docUploading: false,
    calcGross: 0,
    calcRegion: "ew",
    calcPensionPct: 0,
    calcPensionMethod: "none",
    calcLoanPlan: "",
    calcMode: "annual"
  };

  /* ============ Sync (Supabase) runtime ============ */
  var sbClient = null;
  var realtimeChannel = null;
  var docChannel = null;
  var syncPushTimer = null;

  /* ============ Persistence ============ */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      state.entries = raw ? JSON.parse(raw) : [];
    } catch (e) { state.entries = []; }
    try { state.lastRate = localStorage.getItem(RATE_KEY) ? parseFloat(localStorage.getItem(RATE_KEY)) : null; } catch (e) {}
    try { state.theme = localStorage.getItem(THEME_KEY) || null; } catch (e) {}
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  }
  function save(skipPush) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries)); } catch (e) {
      toast("Couldn't save — your browser storage may be full or disabled.");
    }
    if (!skipPush) scheduleSyncPush();
  }
  function saveRate(r) {
    state.lastRate = r;
    try { localStorage.setItem(RATE_KEY, String(r)); } catch (e) {}
  }

  function getClientId() {
    var id = null;
    try { id = localStorage.getItem(CLIENT_ID_KEY); } catch (e) {}
    if (!id) {
      id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem(CLIENT_ID_KEY, id); } catch (e) {}
    }
    return id;
  }
  function loadPin() {
    try { return localStorage.getItem(PIN_KEY) || null; } catch (e) { return null; }
  }
  function savePin(pin) {
    try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
  }
  function clearPin() {
    try { localStorage.removeItem(PIN_KEY); } catch (e) {}
  }

  /* ============ Utilities ============ */
  function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function toMinutes(hhmm) {
    if (!hhmm) return null;
    var parts = hhmm.split(":");
    if (parts.length < 2) return null;
    var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }

  function computeHours(entry) {
    var s = toMinutes(entry.start), e = toMinutes(entry.end);
    if (s === null || e === null) return null;
    var diff = ((e - s) % 1440 + 1440) % 1440;
    return diff / 60;
  }
  function computeHoursWorked(entry) {
    var h = computeHours(entry);
    if (h === null) return null;
    var brk = parseFloat(entry.breakHrs);
    if (isNaN(brk)) brk = 0;
    return h - brk;
  }
  function computePay(entry) {
    var hw = computeHoursWorked(entry);
    var rate = parseFloat(entry.rate);
    if (hw === null || isNaN(rate)) return null;
    return hw * rate;
  }

  function fmtHours(n) { return n === null || isNaN(n) ? "\u2014" : n.toFixed(2).replace(/\.00$/, "") ; }
  function fmtHoursFixed(n) { return n === null || isNaN(n) ? "\u2014" : n.toFixed(2); }
  function fmtPay(n) { return n === null || isNaN(n) ? "\u2014" : "\u00A3" + n.toFixed(2); }
  function fmtDate(iso) {
    if (!iso) return "\u2014";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    return days[d.getDay()] + " " + d.getDate() + " " + MONTH_NAMES[d.getMonth()].slice(0,3) + " " + d.getFullYear();
  }
  function monthKey(iso) {
    if (!iso) return null;
    return iso.slice(0, 7); // YYYY-MM
  }
  function monthLabel(key) {
    var parts = key.split("-");
    return MONTH_NAMES[parseInt(parts[1], 10) - 1] + " " + parts[0];
  }
  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  function isSelected(id) { return !!state.selectedIds[id]; }
  function toggleSelected(id) {
    if (state.selectedIds[id]) delete state.selectedIds[id];
    else state.selectedIds[id] = true;
  }
  function selectedCount() { return Object.keys(state.selectedIds).length; }
  function clearSelection() { state.selectedIds = {}; }

  /* ============ Derived data ============ */
  function sortedEntries() {
    var arr = state.entries.slice();
    arr.sort(function (a, b) {
      if (a.date === b.date) return 0;
      return a.date < b.date ? -1 : 1;
    });
    if (state.sortDir === "desc") arr.reverse();
    return arr;
  }
  function filteredEntries() {
    return sortedEntries().filter(function (e) {
      if (state.filterType && e.type !== state.filterType) return false;
      if (state.filterMonth && monthKey(e.date) !== state.filterMonth) return false;
      return true;
    });
  }
  function monthOptions() {
    var keys = {};
    state.entries.forEach(function (e) { if (e.date) keys[monthKey(e.date)] = true; });
    return Object.keys(keys).sort();
  }
  function inSummaryRange(e) {
    if (!e.date) return false;
    if (state.summaryFrom && e.date < state.summaryFrom) return false;
    if (state.summaryTo && e.date > state.summaryTo) return false;
    return true;
  }
  function summaryEntries() {
    if (!state.summaryFrom && !state.summaryTo) return state.entries;
    return state.entries.filter(inSummaryRange);
  }
  function aggregateByMonth() {
    var map = {};
    summaryEntries().forEach(function (e) {
      var k = monthKey(e.date);
      if (!k) return;
      if (!map[k]) map[k] = { hours: 0, pay: 0, hasHours: false, hasPay: false };
      var hw = computeHoursWorked(e), pay = computePay(e);
      if (hw !== null) { map[k].hours += hw; map[k].hasHours = true; }
      if (pay !== null) { map[k].pay += pay; map[k].hasPay = true; }
    });
    return map;
  }
  /* ============ UK take-home pay (2026/27 rates) ============ */
  function personalAllowance(income) {
    if (income <= 100000) return 12570;
    if (income >= 125140) return 0;
    return 12570 - (income - 100000) / 2;
  }
  function ukIncomeTaxEW(gross) {
    var pa = personalAllowance(gross);
    var taxable = Math.max(0, gross - pa);
    var basicBand = 37700;
    var higherBandTop = 125140 - pa;
    var tax = 0;
    tax += Math.min(taxable, basicBand) * 0.20;
    if (taxable > basicBand) tax += (Math.min(taxable, higherBandTop) - basicBand) * 0.40;
    if (taxable > higherBandTop) tax += (taxable - higherBandTop) * 0.45;
    return Math.max(0, tax);
  }
  function ukIncomeTaxScotland(gross) {
    var pa = personalAllowance(gross);
    var taxable = Math.max(0, gross - pa);
    var stdPA = 12570;
    var bands = [
      { top: 16537 - stdPA, rate: 0.19 },
      { top: 29526 - stdPA, rate: 0.20 },
      { top: 43662 - stdPA, rate: 0.21 },
      { top: 75000 - stdPA, rate: 0.42 },
      { top: 125140 - pa, rate: 0.45 },
      { top: Infinity, rate: 0.48 }
    ];
    var tax = 0, prevTop = 0;
    for (var i = 0; i < bands.length; i++) {
      if (taxable <= prevTop) break;
      var sliceTop = Math.min(taxable, bands[i].top);
      tax += Math.max(0, sliceTop - prevTop) * bands[i].rate;
      prevTop = bands[i].top;
    }
    return Math.max(0, tax);
  }
  function employeeNI(gross) {
    var pt = 12570, uel = 50270;
    if (gross <= pt) return 0;
    var ni = (Math.min(gross, uel) - pt) * 0.08;
    if (gross > uel) ni += (gross - uel) * 0.02;
    return ni;
  }
  function studentLoanRepayment(basis, plan) {
    var thresholds = { plan1: 26900, plan2: 29385, plan4: 33795, plan5: 25000, postgrad: 21000 };
    var rates = { plan1: 0.09, plan2: 0.09, plan4: 0.09, plan5: 0.09, postgrad: 0.06 };
    if (!plan || !thresholds[plan]) return 0;
    return Math.max(0, basis - thresholds[plan]) * rates[plan];
  }
  function cumulativeIncomeTaxEW(ytdGross, monthIndex) {
    var scale = monthIndex / 12;
    var estAnnual = scale > 0 ? ytdGross / scale : ytdGross;
    var pa = personalAllowance(estAnnual) * scale;
    var taxable = Math.max(0, ytdGross - pa);
    var basicBand = 37700 * scale;
    var higherTop = 125140 * scale - pa;
    var tax = 0;
    tax += Math.min(taxable, basicBand) * 0.20;
    if (taxable > basicBand) tax += (Math.min(taxable, higherTop) - basicBand) * 0.40;
    if (taxable > higherTop) tax += (taxable - higherTop) * 0.45;
    return Math.max(0, tax);
  }
  function cumulativeIncomeTaxScotland(ytdGross, monthIndex) {
    var scale = monthIndex / 12;
    var estAnnual = scale > 0 ? ytdGross / scale : ytdGross;
    var pa = personalAllowance(estAnnual) * scale;
    var taxable = Math.max(0, ytdGross - pa);
    var bands = [
      { top: (16537 - 12570) * scale, rate: 0.19 },
      { top: (29526 - 12570) * scale, rate: 0.20 },
      { top: (43662 - 12570) * scale, rate: 0.21 },
      { top: (75000 - 12570) * scale, rate: 0.42 },
      { top: 125140 * scale - pa, rate: 0.45 },
      { top: Infinity, rate: 0.48 }
    ];
    var tax = 0, prev = 0;
    for (var i = 0; i < bands.length; i++) {
      if (taxable <= prev) break;
      var sliceTop = Math.min(taxable, bands[i].top);
      tax += Math.max(0, sliceTop - prev) * bands[i].rate;
      prev = bands[i].top;
    }
    return Math.max(0, tax);
  }
  function monthlyNI(monthGross) {
    var pt = 12570 / 12, uel = 50270 / 12;
    if (monthGross <= pt) return 0;
    var ni = (Math.min(monthGross, uel) - pt) * 0.08;
    if (monthGross > uel) ni += (monthGross - uel) * 0.02;
    return ni;
  }
  function monthlyStudentLoan(monthGross, plan) {
    var thresholds = { plan1: 26900, plan2: 29385, plan4: 33795, plan5: 25000, postgrad: 21000 };
    var rates = { plan1: 0.09, plan2: 0.09, plan4: 0.09, plan5: 0.09, postgrad: 0.06 };
    if (!plan || !thresholds[plan]) return 0;
    return Math.max(0, monthGross - thresholds[plan] / 12) * rates[plan];
  }
  function allMonthsGrossMap() {
    var map = {};
    state.entries.forEach(function (e) {
      var k = monthKey(e.date);
      if (!k) return;
      var pay = computePay(e);
      if (pay === null) return;
      map[k] = (map[k] || 0) + pay;
    });
    return map;
  }
  function taxYearInfo(monthKeyStr) {
    var parts = monthKeyStr.split("-");
    var calYear = parseInt(parts[0], 10), calMonth = parseInt(parts[1], 10);
    var startYear = calMonth >= 4 ? calYear : calYear - 1;
    return { label: startYear + "/" + String(startYear + 1).slice(2), monthIndex: ((calMonth - 4 + 12) % 12) + 1 };
  }
  function monthlyPayeBreakdown(vals) {
    var grossMap = allMonthsGrossMap();
    var keys = Object.keys(grossMap).sort();
    var byTaxYear = {};
    keys.forEach(function (k) {
      var info = taxYearInfo(k);
      if (!byTaxYear[info.label]) byTaxYear[info.label] = [];
      byTaxYear[info.label].push({ key: k, monthIndex: info.monthIndex, gross: grossMap[k] });
    });

    var rows = [];
    Object.keys(byTaxYear).sort().forEach(function (taxYearLabel) {
      var months = byTaxYear[taxYearLabel].slice().sort(function (a, b) { return a.monthIndex - b.monthIndex; });
      var cumTaxableGross = 0, cumTaxPaid = 0;
      months.forEach(function (m) {
        var pensionAmount = vals.pensionMethod === "none" ? 0 : m.gross * (vals.pensionPct / 100);
        var taxableThisMonth = Math.max(0, m.gross - pensionAmount);
        var niBasisThisMonth = vals.pensionMethod === "sacrifice" ? Math.max(0, m.gross - pensionAmount) : m.gross;

        cumTaxableGross += taxableThisMonth;
        var due = vals.region === "scotland"
          ? cumulativeIncomeTaxScotland(cumTaxableGross, m.monthIndex)
          : cumulativeIncomeTaxEW(cumTaxableGross, m.monthIndex);
        var monthTax = due - cumTaxPaid;
        cumTaxPaid = due;

        var monthNI = monthlyNI(niBasisThisMonth);
        var monthLoan = monthlyStudentLoan(niBasisThisMonth, vals.loanPlan);
        var net = m.gross - monthTax - monthNI - monthLoan - pensionAmount;

        rows.push({ taxYear: taxYearLabel, key: m.key, gross: m.gross, incomeTax: monthTax, ni: monthNI, loan: monthLoan, pension: pensionAmount, net: net });
      });
    });
    return rows;
  }

  function computeTakeHome(vals) {
    var gross = vals.gross;
    var pensionAmount = vals.pensionMethod === "none" ? 0 : gross * (vals.pensionPct / 100);
    var taxBasis = Math.max(0, gross - pensionAmount);
    var niBasis = vals.pensionMethod === "sacrifice" ? Math.max(0, gross - pensionAmount) : gross;
    var incomeTax = vals.region === "scotland" ? ukIncomeTaxScotland(taxBasis) : ukIncomeTaxEW(taxBasis);
    var ni = employeeNI(niBasis);
    var loan = studentLoanRepayment(niBasis, vals.loanPlan);
    var net = gross - incomeTax - ni - loan - pensionAmount;
    return { gross: gross, incomeTax: incomeTax, ni: ni, loan: loan, pension: pensionAmount, net: net };
  }

  function summaryStats() {
    var byMonth = aggregateByMonth();
    var keys = Object.keys(byMonth).sort();
    var totalHours = 0, totalPay = 0;
    keys.forEach(function (k) { totalHours += byMonth[k].hours; totalPay += byMonth[k].pay; });

    var hoursMonths = keys.filter(function (k) { return byMonth[k].hours > 0; });
    var payMonths = keys.filter(function (k) { return byMonth[k].pay > 0; });
    var avgHours = hoursMonths.length ? hoursMonths.reduce(function (s, k) { return s + byMonth[k].hours; }, 0) / hoursMonths.length : 0;
    var avgPay = payMonths.length ? payMonths.reduce(function (s, k) { return s + byMonth[k].pay; }, 0) / payMonths.length : 0;

    var busiestKey = null, busiestPay = -1;
    keys.forEach(function (k) { if (byMonth[k].pay > busiestPay) { busiestPay = byMonth[k].pay; busiestKey = k; } });

    var rangeEntries = summaryEntries();
    var working = rangeEntries.filter(function (e) { return e.type && e.type !== "Off"; });
    var logged = rangeEntries.filter(function (e) { return !!e.type; });
    function pct(type, denom) { return denom.length ? (denom.filter(function (e) { return e.type === type; }).length / denom.length) : 0; }

    return {
      totalHours: totalHours, totalPay: totalPay,
      avgHours: avgHours, avgPay: avgPay,
      busiestKey: busiestKey, busiestPay: busiestKey ? byMonth[busiestKey].pay : 0,
      byMonth: byMonth, monthKeys: keys,
      entryCount: rangeEntries.length,
      breakdown: {
        "Warehouse": pct("Warehouse", working),
        "On Site": pct("On Site", working),
        "Holiday": pct("Holiday", working),
        "Sick": pct("Sick", logged)
      }
    };
  }

  /* ============ Excel import helpers ============ */
  function excelSerialToISODate(serial) {
    var utcDays = Math.floor(serial - 25569);
    var d = new Date(utcDays * 86400 * 1000);
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }
  function excelFractionToHHMM(frac) {
    var totalMin = Math.round(frac * 24 * 60);
    totalMin = ((totalMin % 1440) + 1440) % 1440;
    return pad2(Math.floor(totalMin / 60)) + ":" + pad2(totalMin % 60);
  }
  function parseLooseTime(v) {
    if (v === null || v === undefined || v === "") return "";
    if (typeof v === "number") return excelFractionToHHMM(v);
    var s = String(v).trim();
    var m = s.match(/^(\d{1,2}):(\d{2})/);
    if (m) return pad2(parseInt(m[1], 10)) + ":" + m[2];
    var ampm = s.match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])$/);
    if (ampm) {
      var h = parseInt(ampm[1], 10) % 12;
      if (/[Pp]/.test(ampm[3])) h += 12;
      return pad2(h) + ":" + ampm[2];
    }
    return "";
  }
  function parseLooseDate(v) {
    if (v === null || v === undefined || v === "") return "";
    if (typeof v === "number") return excelSerialToISODate(v);
    var s = String(v).trim();
    var d = new Date(s);
    if (!isNaN(d)) return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    return "";
  }

  function importWorkbook(wb) {
    var sheetName = wb.SheetNames.find(function (n) { return n.replace(/\s|_/g, "").toLowerCase() === "alldata"; }) || wb.SheetNames[0];
    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
    if (!rows.length) { toast("Couldn't find any rows to import."); return; }
    var header = rows[0].map(function (h) { return String(h || "").trim().toLowerCase(); });
    function col(names) {
      for (var i = 0; i < names.length; i++) {
        var idx = header.indexOf(names[i]);
        if (idx !== -1) return idx;
      }
      return -1;
    }
    var idx = {
      date: col(["date"]),
      start: col(["start"]),
      end: col(["end"]),
      brk: col(["break"]),
      rate: col(["rate"]),
      type: col(["type"]),
      notes: col(["notes"])
    };
    if (idx.date === -1) { toast("Couldn't find a Date column in that sheet."); return; }

    var byDate = {};
    state.entries.forEach(function (e) { byDate[e.date] = e; });

    var imported = 0;
    var emptyStreak = 0;
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var dateVal = row && idx.date !== -1 ? row[idx.date] : "";
      var iso = parseLooseDate(dateVal);
      if (!iso) {
        emptyStreak++;
        // Sheets sometimes declare a range covering the whole column;
        // stop once we've clearly run past the real data.
        if (imported > 0 && emptyStreak > 500) break;
        continue;
      }
      emptyStreak = 0;

      var existing = byDate[iso];
      var entry = existing ? Object.assign({}, existing) : { id: uid(), date: iso };
      entry.date = iso;
      if (idx.start !== -1) entry.start = parseLooseTime(row[idx.start]);
      if (idx.end !== -1) entry.end = parseLooseTime(row[idx.end]);
      if (idx.brk !== -1) entry.breakHrs = row[idx.brk] === "" ? "" : parseFloat(row[idx.brk]);
      if (idx.rate !== -1) entry.rate = row[idx.rate] === "" ? "" : parseFloat(row[idx.rate]);
      if (idx.type !== -1) entry.type = String(row[idx.type] || "").trim();
      if (idx.notes !== -1) entry.notes = String(row[idx.notes] || "").trim();

      byDate[iso] = entry;
      imported++;
    }
    state.entries = Object.keys(byDate).map(function (k) { return byDate[k]; });
    save();
    toast("Imported " + imported + " row" + (imported === 1 ? "" : "s") + " from " + sheetName + ".");
    render();
  }

  /* ============ Export ============ */
  function exportCSV() {
    var rows = [["Date","Start","End","Hours","Break","Hours Worked","Rate","Pay","Month","Type","Notes"]];
    sortedEntries().forEach(function (e) {
      var hours = computeHours(e), hw = computeHoursWorked(e), pay = computePay(e);
      rows.push([
        e.date || "", e.start || "", e.end || "",
        hours === null ? "" : hours.toFixed(2),
        e.breakHrs === "" || e.breakHrs === undefined || e.breakHrs === null ? "" : e.breakHrs,
        hw === null ? "" : hw.toFixed(2),
        e.rate === "" || e.rate === undefined || e.rate === null ? "" : e.rate,
        pay === null ? "" : pay.toFixed(2),
        e.date ? monthLabel(monthKey(e.date)) : "",
        e.type || "", e.notes || ""
      ]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) {
        var s = String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv" });
    offerDownload(blob, "DK_Timesheet.csv");
  }
  function exportXLSX() {
    var dataRows = [["Date","Start","End","Hours","Break","Hours Worked","Rate","Pay","Month","Type","Notes"]];
    sortedEntries().forEach(function (e) {
      var hours = computeHours(e), hw = computeHoursWorked(e), pay = computePay(e);
      dataRows.push([
        e.date || "", e.start || "", e.end || "",
        hours === null ? "" : Number(hours.toFixed(2)),
        e.breakHrs === "" || e.breakHrs === undefined ? "" : Number(e.breakHrs),
        hw === null ? "" : Number(hw.toFixed(2)),
        e.rate === "" || e.rate === undefined ? "" : Number(e.rate),
        pay === null ? "" : Number(pay.toFixed(2)),
        e.date ? monthLabel(monthKey(e.date)) : "",
        e.type || "", e.notes || ""
      ]);
    });
    var stats = summaryStats();
    var summaryRows = [
      ["Summary Dashboard"], [],
      ["Total Hours", "Total Pay", "Avg Hours/Month", "Avg Pay/Month", "Busiest Month"],
      [Number(stats.totalHours.toFixed(2)), Number(stats.totalPay.toFixed(2)), Number(stats.avgHours.toFixed(2)), Number(stats.avgPay.toFixed(2)), stats.busiestKey ? monthLabel(stats.busiestKey) + " (\u00A3" + stats.totalPay.toFixed(2) + ")" : ""],
      [],
      ["Warehouse %", "On Site %", "Holiday %", "Sick %"],
      [Math.round(stats.breakdown["Warehouse"] * 1000) / 10, Math.round(stats.breakdown["On Site"] * 1000) / 10, Math.round(stats.breakdown["Holiday"] * 1000) / 10, Math.round(stats.breakdown["Sick"] * 1000) / 10],
      [],
      ["Month", "Hours Worked", "Pay"]
    ];
    stats.monthKeys.forEach(function (k) {
      summaryRows.push([monthLabel(k), Number(stats.byMonth[k].hours.toFixed(2)), Number(stats.byMonth[k].pay.toFixed(2))]);
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dataRows), "All_Data");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "Summary");
    var wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    var blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    offerDownload(blob, "DK_Timesheet.xlsx");
  }
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ============ Sync (Supabase) ============ */
  function syncStatusLabel() {
    switch (state.syncStatus) {
      case "connecting": return "Connecting\u2026";
      case "syncing": return "Syncing\u2026";
      case "synced": return "Synced";
      case "error": return "Offline";
      default: return "Sync";
    }
  }
  function updateSyncStatusUI() {
    var pill = document.getElementById("syncStatusPill");
    if (!pill) return;
    var dot = pill.querySelector(".sync-dot");
    var label = pill.querySelector(".sync-label");
    if (dot) dot.className = "sync-dot " + state.syncStatus;
    if (label) label.textContent = syncStatusLabel();
  }
  function maskPin(pin) {
    if (!pin) return "";
    if (pin.length <= 2) return pin.charAt(0) + "*";
    return pin.charAt(0) + new Array(pin.length - 1).join("*") + pin.charAt(pin.length - 1);
  }
  function formatTimeShort(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }

  async function pushRow(client, pin) {
    var payload = { pin: pin, entries: state.entries, updated_by: getClientId(), updated_at: new Date().toISOString() };
    var res = await client.from(SYNC_TABLE).upsert(payload, { onConflict: "pin" });
    if (res.error) throw res.error;
  }

  function scheduleSyncPush() {
    if (!state.authed || !sbClient) return;
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(doSyncPush, 800);
  }
  async function doSyncPush() {
    if (!sbClient || !state.pin) return;
    state.syncStatus = "syncing";
    updateSyncStatusUI();
    try {
      await pushRow(sbClient, state.pin);
      state.syncStatus = "synced";
      state.lastSynced = new Date();
    } catch (e) {
      state.syncStatus = "error";
      toast("Sync failed: " + (e && e.message ? e.message : "unknown error"));
    }
    updateSyncStatusUI();
  }

  function handleRemoteChange(payload) {
    var row = payload && payload.new;
    if (!row) return;
    if (row.updated_by === getClientId()) return; // our own write echoing back
    state.entries = row.entries || [];
    save(true);
    state.lastSynced = new Date();
    state.syncStatus = "synced";
    toast("Updated from another device.");
    render();
  }
  function subscribeRealtime(pin) {
    if (!sbClient) return;
    if (realtimeChannel) {
      try { sbClient.removeChannel(realtimeChannel); } catch (e) {}
      realtimeChannel = null;
    }
    realtimeChannel = sbClient.channel("sync-" + pin)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: SYNC_TABLE, filter: "pin=eq." + pin }, handleRemoteChange)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: SYNC_TABLE, filter: "pin=eq." + pin }, handleRemoteChange)
      .subscribe();
  }

  async function attemptLogin(pin, opts) {
    opts = opts || {};
    var cleanPin = String(pin || "").trim();
    if (!cleanPin || cleanPin.length < 4) {
      if (!opts.silent) { state.gateError = "Enter a PIN with at least 4 characters."; render(); }
      return;
    }

    state.pinAttempting = true;
    state.gateError = "";
    if (!opts.silent) render();

    var client;
    try {
      client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      state.pinAttempting = false;
      state.gateError = "Couldn't start the sync client.";
      render();
      return;
    }

    try {
      var res = await client.from(SYNC_TABLE).select("entries,updated_at,updated_by").eq("pin", cleanPin).maybeSingle();
      if (res.error) throw res.error;
      var row = res.data;
      if (row) {
        state.entries = row.entries || [];
        save(true);
      } else {
        // First time this PIN has been used — seed it with whatever's on this device.
        await pushRow(client, cleanPin);
      }
      sbClient = client;
      state.pin = cleanPin;
      savePin(cleanPin);
      subscribeRealtime(cleanPin);
      subscribeDocRealtime(cleanPin);
      loadDocuments();
      state.authed = true;
      state.syncStatus = "synced";
      state.lastSynced = new Date();
      state.pinAttempting = false;
      render();
    } catch (e) {
      state.pinAttempting = false;
      if (opts.silent) {
        // Already logged in on this device before — let them work from the
        // local cache while offline rather than locking them out.
        state.pin = cleanPin;
        state.authed = true;
        state.syncStatus = "error";
        render();
        toast("Couldn't reach sync \u2014 showing your last saved data.");
      } else {
        state.gateError = "Couldn't reach sync (" + (e && e.message ? e.message : "unknown error") + "). Check your connection and try again.";
        render();
      }
    }
  }

  function logout() {
    if (realtimeChannel && sbClient) { try { sbClient.removeChannel(realtimeChannel); } catch (e) {} }
    if (docChannel && sbClient) { try { sbClient.removeChannel(docChannel); } catch (e) {} }
    realtimeChannel = null;
    docChannel = null;
    sbClient = null;
    clearPin();
    state.authed = false;
    state.pin = null;
    state.syncStatus = "off";
    state.gateError = "";
    state.documents = [];
    render();
  }

  /* ============ Documents (Supabase Storage) ============ */
  var DOC_BUCKET = "documents";
  var DOC_TABLE = "timesheet_documents";

  function formatBytes(n) {
    if (n === null || n === undefined || isNaN(n)) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }
  function docPublicUrl(storagePath) {
    if (!sbClient) return "#";
    var res = sbClient.storage.from(DOC_BUCKET).getPublicUrl(storagePath);
    return (res && res.data && res.data.publicUrl) || "#";
  }
  function sortedDocuments() {
    var arr = state.documents.slice();
    arr.sort(function (a, b) { return new Date(b.uploaded_at) - new Date(a.uploaded_at); });
    return arr;
  }
  function docsForDate(dateIso) {
    return state.documents.filter(function (d) { return d.entry_date === dateIso; });
  }

  async function loadDocuments() {
    if (!sbClient || !state.pin) return;
    try {
      var res = await sbClient.from(DOC_TABLE).select("*").eq("pin", state.pin).order("uploaded_at", { ascending: false });
      if (res.error) throw res.error;
      state.documents = res.data || [];
      render();
    } catch (e) {
      toast("Couldn't load documents: " + (e && e.message ? e.message : "unknown error"));
    }
  }

  function subscribeDocRealtime(pin) {
    if (!sbClient) return;
    if (docChannel) { try { sbClient.removeChannel(docChannel); } catch (e) {} docChannel = null; }
    docChannel = sbClient.channel("docs-" + pin)
      .on("postgres_changes", { event: "*", schema: "public", table: DOC_TABLE, filter: "pin=eq." + pin }, function () {
        loadDocuments();
      })
      .subscribe();
  }

  async function uploadDocument(file, entryDate, label) {
    if (!sbClient || !state.pin) { toast("Not connected \u2014 try logging in again."); return; }
    if (!file) return;
    state.docUploading = true;
    render();
    try {
      var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      var storagePath = state.pin + "/" + uid() + "-" + safeName;
      var upRes = await sbClient.storage.from(DOC_BUCKET).upload(storagePath, file, { upsert: false });
      if (upRes.error) throw upRes.error;

      var meta = {
        pin: state.pin,
        entry_date: entryDate || null,
        filename: label && label.trim() ? label.trim() : file.name,
        storage_path: storagePath,
        mime_type: file.type || null,
        size_bytes: file.size || null
      };
      var insRes = await sbClient.from(DOC_TABLE).insert(meta).select();
      if (insRes.error) throw insRes.error;

      state.docUploading = false;
      await loadDocuments();
      toast("Uploaded " + meta.filename);
    } catch (e) {
      state.docUploading = false;
      render();
      toast("Upload failed: " + (e && e.message ? e.message : "unknown error"));
    }
  }

  async function deleteDocument(doc) {
    if (!sbClient) return;
    if (!confirm("Delete \u201c" + doc.filename + "\u201d? This can't be undone.")) return;
    try {
      await sbClient.storage.from(DOC_BUCKET).remove([doc.storage_path]);
      var res = await sbClient.from(DOC_TABLE).delete().eq("id", doc.id);
      if (res.error) throw res.error;
      state.documents = state.documents.filter(function (d) { return d.id !== doc.id; });
      render();
      toast("Deleted.");
    } catch (e) {
      toast("Couldn't delete: " + (e && e.message ? e.message : "unknown error"));
    }
  }

  /* ============ Rendering ============ */
  function render() {
    var app = document.getElementById("app");
    if (!state.authed) {
      app.innerHTML = renderGate();
      attachGateEvents();
      return;
    }
    var body = state.tab === "summary" ? renderSummary() : state.tab === "docs" ? renderDocuments() : state.tab === "calc" ? renderPayCalc() : renderLog();
    app.innerHTML = renderTopbar() + renderTabs() + body;
    attachEvents();
  }

  function renderGate() {
    return '' +
      '<div class="gate-wrap"><div class="card gate-card">' +
        '<div class="gate-mark">DK <span>Timesheet</span></div>' +
        '<div class="gate-sub">Enter your PIN to continue</div>' +
        '<input type="password" id="gatePin" class="field-input gate-input" placeholder="PIN" autocomplete="off" inputmode="text">' +
        (state.gateError ? '<div class="gate-error">' + escapeHtml(state.gateError) + '</div>' : '') +
        '<button class="btn btn-primary" id="gateSubmit" style="width:100%;margin-top:12px;"' + (state.pinAttempting ? " disabled" : "") + '>' + (state.pinAttempting ? "Checking\u2026" : "Unlock") + '</button>' +
      '</div></div>';
  }

  function renderTopbar() {
    var isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.hasAttribute("data-theme") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    return '' +
      '<div class="topbar">' +
        '<div class="brand"><span class="mark">DK <span>Timesheet</span></span></div>' +
        '<div class="header-actions">' +
          '<span class="sync-btn" id="syncStatusPill" title="PIN ' + escapeHtml(maskPin(state.pin)) + '"><span class="sync-dot ' + state.syncStatus + '"></span><span class="sync-label">' + syncStatusLabel() + '</span></span>' +
          '<button class="btn btn-sm" id="logoutBtn">Log out</button>' +
          '<button class="theme-toggle" id="themeToggle">' + (isDark ? "Light mode" : "Dark mode") + '</button>' +
        '</div>' +
      '</div>';
  }

  function renderTabs() {
    return '' +
      '<div class="tabs">' +
        '<button class="tab' + (state.tab === "summary" ? " active" : "") + '" data-tab="summary">Summary</button>' +
        '<button class="tab' + (state.tab === "log" ? " active" : "") + '" data-tab="log">All Data</button>' +
        '<button class="tab' + (state.tab === "docs" ? " active" : "") + '" data-tab="docs">Documents</button>' +
        '<button class="tab' + (state.tab === "calc" ? " active" : "") + '" data-tab="calc">Take-Home Pay</button>' +
      '</div>';
  }

  function docIcon(mime, filename) {
    var m = (mime || "").toLowerCase();
    var f = (filename || "").toLowerCase();
    if (m.indexOf("pdf") !== -1 || /\.pdf$/.test(f)) return "\uD83D\uDCC4";
    if (m.indexOf("image") !== -1 || /\.(png|jpe?g|gif|webp|heic)$/.test(f)) return "\uD83D\uDDBC\uFE0F";
    return "\uD83D\uDCCE";
  }
  function uniqueDocDates() {
    var set = {};
    state.documents.forEach(function (d) { if (d.entry_date) set[d.entry_date] = true; });
    return Object.keys(set).sort().reverse().map(function (dt) {
      return '<option value="' + dt + '"' + (state.docFilterDate === dt ? " selected" : "") + '>' + fmtDate(dt) + "</option>";
    }).join("");
  }
  function renderDocRow(doc) {
    var icon = docIcon(doc.mime_type, doc.filename);
    var dateLabel = doc.entry_date ? fmtDate(doc.entry_date) : "General";
    var uploadedDate = doc.uploaded_at ? doc.uploaded_at.slice(0, 10) : "";
    var url = docPublicUrl(doc.storage_path);
    return '<div class="doc-row">' +
      '<div class="doc-icon">' + icon + '</div>' +
      '<div class="doc-main">' +
        '<div class="doc-name">' + escapeHtml(doc.filename) + '</div>' +
        '<div class="doc-meta">' + dateLabel + ' &middot; ' + formatBytes(doc.size_bytes) + ' &middot; added ' + (uploadedDate ? fmtDate(uploadedDate) : "") + '</div>' +
      '</div>' +
      '<div class="doc-actions">' +
        '<a class="icon-btn" href="' + url + '" target="_blank" rel="noopener">View</a>' +
        '<button class="icon-btn danger" data-doc-delete="' + doc.id + '">Delete</button>' +
      '</div>' +
    '</div>';
  }
  function renderDocuments() {
    var docs = sortedDocuments().filter(function (d) {
      if (!state.docFilterDate) return true;
      if (state.docFilterDate === "__none__") return !d.entry_date;
      return d.entry_date === state.docFilterDate;
    });

    var filterBar = '<div class="log-toolbar">' +
      '<div class="btn-row"><b>' + state.documents.length + '</b>&nbsp;file' + (state.documents.length === 1 ? "" : "s") + '</div>' +
      '<div class="filters">' +
        '<select id="docDateFilter" class="field-input">' +
          '<option value="">All dates</option>' +
          '<option value="__none__"' + (state.docFilterDate === "__none__" ? " selected" : "") + '>General (no date)</option>' +
          uniqueDocDates() +
        '</select>' +
      '</div>' +
    '</div>';

    var uploadCard = '<div class="card doc-upload">' +
      '<div class="form-grid">' +
        '<div class="field full"><label>File</label><input type="file" id="docFile"></div>' +
        '<div class="field"><label>Link to a date (optional)</label><input type="date" id="docDate"></div>' +
        '<div class="field"><label>Label (optional)</label><input type="text" id="docLabel" placeholder="e.g. Fuel receipt"></div>' +
      '</div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="docUploadBtn"' + (state.docUploading ? " disabled" : "") + '>' + (state.docUploading ? "Uploading\u2026" : "Upload") + '</button></div>' +
    '</div>';

    if (!docs.length) {
      return filterBar + uploadCard + '<div class="card empty-state"><div class="big">No documents' + (state.docFilterDate ? " match this filter" : "") + '</div>Upload receipts, call sheets, risk assessments or photos above.</div>';
    }

    var rows = docs.map(renderDocRow).join("");
    return filterBar + uploadCard + '<div class="card doc-list-wrap">' + rows + '</div>' +
      '<p class="footnote">Files are stored in your Supabase project. Anyone with a file\u2019s link can open it \u2014 avoid uploading anything you wouldn\u2019t want casually shareable.</p>';
  }

  function readCalcState() {
    return {
      gross: state.calcGross || 0,
      region: state.calcRegion || "ew",
      pensionPct: state.calcPensionPct || 0,
      pensionMethod: state.calcPensionMethod || "none",
      loanPlan: state.calcLoanPlan || ""
    };
  }
  function renderCalcResults(vals) {
    if (!vals.gross || vals.gross <= 0) {
      return '<div class="card empty-state" style="padding:30px 20px;"><div class="big">Enter a gross annual pay above</div>The breakdown will appear here.</div>';
    }
    var r = computeTakeHome(vals);
    function row(label, annual) {
      return '<tr><td>' + label + '</td><td class="num">' + fmtPay(annual) + '</td><td class="num">' + fmtPay(annual / 12) + '</td><td class="num">' + fmtPay(annual / 52) + '</td></tr>';
    }
    var effectiveRate = r.gross > 0 ? ((r.incomeTax + r.ni) / r.gross * 100) : 0;
    return '' +
      '<div class="stat-grid">' +
        '<div class="card stat-card"><div class="stat-label">Take-home (annual)</div><div class="stat-value">' + fmtPay(r.net) + '</div></div>' +
        '<div class="card stat-card"><div class="stat-label">Take-home (monthly)</div><div class="stat-value" style="font-size:19px">' + fmtPay(r.net / 12) + '</div></div>' +
        '<div class="card stat-card"><div class="stat-label">Tax + NI rate</div><div class="stat-value" style="font-size:19px">' + effectiveRate.toFixed(1) + '%</div></div>' +
      '</div>' +
      '<div class="card month-table"><table><thead><tr><th></th><th class="num">Annual</th><th class="num">Monthly</th><th class="num">Weekly</th></tr></thead><tbody>' +
        row("Gross pay", r.gross) +
        row("Income Tax", r.incomeTax) +
        row("National Insurance", r.ni) +
        (vals.loanPlan ? row("Student loan", r.loan) : "") +
        (vals.pensionMethod !== "none" ? row("Pension", r.pension) : "") +
      '</tbody><tfoot><tr style="font-weight:600;border-top:2px solid var(--line);"><td>Take-home pay</td><td class="num">' + fmtPay(r.net) + '</td><td class="num">' + fmtPay(r.net / 12) + '</td><td class="num">' + fmtPay(r.net / 52) + '</td></tr></tfoot></table></div>';
  }
  function renderRegionLoanPensionFields(vals) {
    return '' +
      '<div class="field"><label>Region</label><select id="calcRegion" class="field-input">' +
        '<option value="ew"' + (vals.region !== "scotland" ? " selected" : "") + '>England / Wales / NI</option>' +
        '<option value="scotland"' + (vals.region === "scotland" ? " selected" : "") + '>Scotland</option>' +
      '</select></div>' +
      '<div class="field"><label>Student loan</label><select id="calcLoanPlan" class="field-input">' +
        '<option value="">None</option>' +
        '<option value="plan1"' + (vals.loanPlan === "plan1" ? " selected" : "") + '>Plan 1</option>' +
        '<option value="plan2"' + (vals.loanPlan === "plan2" ? " selected" : "") + '>Plan 2</option>' +
        '<option value="plan4"' + (vals.loanPlan === "plan4" ? " selected" : "") + '>Plan 4 (Scotland)</option>' +
        '<option value="plan5"' + (vals.loanPlan === "plan5" ? " selected" : "") + '>Plan 5</option>' +
        '<option value="postgrad"' + (vals.loanPlan === "postgrad" ? " selected" : "") + '>Postgraduate</option>' +
      '</select></div>' +
      '<div class="field"><label>Pension contribution</label><select id="calcPensionMethod" class="field-input">' +
        '<option value="none"' + (vals.pensionMethod === "none" ? " selected" : "") + '>None</option>' +
        '<option value="sacrifice"' + (vals.pensionMethod === "sacrifice" ? " selected" : "") + '>Salary sacrifice (reduces tax &amp; NI)</option>' +
        '<option value="netpay"' + (vals.pensionMethod === "netpay" ? " selected" : "") + '>Net pay / relief at source (reduces tax only, approx.)</option>' +
      '</select></div>' +
      '<div class="field"><label>Pension %</label><input type="number" step="0.5" min="0" max="100" id="calcPensionPct" class="field-input" value="' + (vals.pensionPct || 0) + '"' + (vals.pensionMethod === "none" ? " disabled" : "") + '></div>';
  }

  function renderPayCalcAnnual() {
    var vals = readCalcState();
    var summaryTotal = summaryStats().totalPay;
    var inputs = '<div class="card calc-card">' +
      '<div class="form-grid">' +
        '<div class="field full"><label>Gross annual pay (\u00A3)</label><input type="number" step="0.01" min="0" id="calcGross" class="field-input" value="' + (vals.gross || "") + '" placeholder="e.g. 28000"></div>' +
        renderRegionLoanPensionFields(vals) +
      '</div>' +
      (summaryTotal > 0 ? '<div class="btn-row"><button class="btn btn-sm" id="calcUseSummary">Use Summary total pay (' + fmtPay(summaryTotal) + ')</button></div>' : "") +
    '</div>';

    return inputs + '<div id="calcResults">' + renderCalcResults(vals) + '</div>' +
      '<p class="footnote">Estimated using 2026/27 UK income tax, National Insurance and student loan rates. This annualises your pay, so if your hours vary month to month the actual PAYE deduction on any one payslip can differ from this. This isn\u2019t tax advice \u2014 check gov.uk or a tax professional for anything that matters financially.</p>';
  }

  function renderMonthlyTables(vals) {
    var rows = monthlyPayeBreakdown(vals);
    if (!rows.length) {
      return '<div class="card empty-state"><div class="big">No logged pay yet</div>Add entries in All Data first, then come back here.</div>';
    }
    var byYear = {};
    rows.forEach(function (r) { if (!byYear[r.taxYear]) byYear[r.taxYear] = []; byYear[r.taxYear].push(r); });

    var showLoan = !!vals.loanPlan;
    var showPension = vals.pensionMethod !== "none";

    var tablesHtml = Object.keys(byYear).sort().map(function (ty) {
      var yearRows = byYear[ty];
      var totalGross = 0, totalNet = 0;
      var body = yearRows.map(function (r) {
        totalGross += r.gross; totalNet += r.net;
        return '<tr><td class="m-label">' + monthLabel(r.key) + '</td>' +
          '<td class="num">' + fmtPay(r.gross) + '</td>' +
          '<td class="num">' + fmtPay(r.incomeTax) + '</td>' +
          '<td class="num">' + fmtPay(r.ni) + '</td>' +
          (showLoan ? '<td class="num">' + fmtPay(r.loan) + '</td>' : "") +
          (showPension ? '<td class="num">' + fmtPay(r.pension) + '</td>' : "") +
          '<td class="num">' + fmtPay(r.net) + '</td></tr>';
      }).join("");
      var colCount = 3 + (showLoan ? 1 : 0) + (showPension ? 1 : 0);
      return '<div class="section-title">Tax year ' + ty + '</div>' +
        '<div class="card month-table"><table><thead><tr><th>Month</th><th class="num">Gross</th><th class="num">Income Tax</th><th class="num">NI</th>' +
        (showLoan ? '<th class="num">Loan</th>' : "") + (showPension ? '<th class="num">Pension</th>' : "") +
        '<th class="num">Take-home</th></tr></thead><tbody>' + body + '</tbody>' +
        '<tfoot><tr style="font-weight:600;border-top:2px solid var(--line);"><td>Total</td><td class="num">' + fmtPay(totalGross) + '</td><td colspan="' + colCount + '"></td><td class="num">' + fmtPay(totalNet) + '</td></tr></tfoot>' +
        '</table></div>';
    }).join("");

    return tablesHtml +
      '<p class="footnote">This mimics real PAYE: Income Tax builds up against your year-to-date pay and allowance across the tax year (April\u2013March), while National Insurance and student loan are worked out fresh each month on that month\u2019s own pay \u2014 same as your actual payslips. A negative tax figure in a month is a genuine in-year refund: it happens when a quiet month follows a busy one, because your built-up tax-free allowance has outpaced what you\u2019ve earned so far that year. Still an estimate \u2014 not a substitute for your payslips or a tax professional.</p>';
  }

  function renderPayCalcMonthly() {
    var vals = readCalcState();
    var controls = '<div class="card calc-card"><div class="form-grid">' + renderRegionLoanPensionFields(vals) + '</div></div>';
    return controls + '<div id="monthlyResults">' + renderMonthlyTables(vals) + '</div>';
  }

  function renderPayCalc() {
    var mode = state.calcMode || "annual";
    var modeToggle = '<div class="log-toolbar">' +
      '<div class="btn-row">' +
        '<button class="btn btn-sm' + (mode === "annual" ? " btn-primary" : "") + '" data-calc-mode="annual">Annual estimate</button>' +
        '<button class="btn btn-sm' + (mode === "monthly" ? " btn-primary" : "") + '" data-calc-mode="monthly">Month by month (from your log)</button>' +
      '</div>' +
    '</div>';
    return modeToggle + (mode === "monthly" ? renderPayCalcMonthly() : renderPayCalcAnnual());
  }

  function renderSummary() {
    if (!state.entries.length) return renderEmpty();
    var s = summaryStats();
    var rangeBar = renderRangeBar();

    if (!s.entryCount) {
      return rangeBar + '<div class="card empty-state" style="padding:40px 20px;">' +
        '<div class="big">No entries in this range</div>' +
        'Try a wider date range, or clear it to see everything.' +
      '</div>';
    }

    var barColors = { "Warehouse": "var(--warehouse)", "On Site": "var(--onsite)", "Holiday": "var(--holiday)", "Sick": "var(--sick)" };

    var bars = ["Warehouse", "On Site", "Holiday", "Sick"].map(function (t) {
      var pct = Math.round(s.breakdown[t] * 1000) / 10;
      return '<div class="bar-row">' +
        '<span class="bar-tag ' + TYPE_CLASS[t] + '">' + t + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(pct,100) + '%;background:' + barColors[t] + '"></div></div>' +
        '<span class="bar-pct">' + pct.toFixed(1) + '%</span>' +
      '</div>';
    }).join("");

    var monthRows = s.monthKeys.filter(function (k) {
      var m = s.byMonth[k];
      return m.hours !== 0 || m.pay !== 0;
    }).map(function (k) {
      var m = s.byMonth[k];
      return '<tr class="' + (k === s.busiestKey ? "busiest" : "") + '">' +
        '<td class="m-label">' + monthLabel(k) + '</td>' +
        '<td class="num">' + fmtHoursFixed(m.hours) + '</td>' +
        '<td class="num">' + fmtPay(m.pay) + '</td>' +
      '</tr>';
    }).join("");

    return rangeBar +
      '<div class="stat-grid">' +
        '<div class="card stat-card"><div class="stat-label">Total hours logged</div><div class="stat-value">' + fmtHoursFixed(s.totalHours) + ' <small>hrs</small></div></div>' +
        '<div class="card stat-card"><div class="stat-label">Total pay</div><div class="stat-value">' + fmtPay(s.totalPay) + '</div></div>' +
        '<div class="card stat-card"><div class="stat-label">Busiest month</div><div class="stat-value" style="font-size:19px">' + (s.busiestKey ? monthLabel(s.busiestKey) : "\u2014") + '</div><div class="stat-sub">' + (s.busiestKey ? fmtPay(s.busiestPay) + " earned" : "") + '</div></div>' +
      '</div>' +
      '<div class="stat-grid">' +
        '<div class="card stat-card"><div class="stat-label">Average hours / month</div><div class="stat-value" style="font-size:19px">' + fmtHoursFixed(s.avgHours) + ' hrs</div></div>' +
        '<div class="card stat-card"><div class="stat-label">Average pay / month</div><div class="stat-value" style="font-size:19px">' + fmtPay(s.avgPay) + '</div></div>' +
        '<div class="card stat-card"><div class="stat-label">Days logged</div><div class="stat-value" style="font-size:19px">' + s.entryCount + '</div></div>' +
      '</div>' +
      '<div class="section-title">Day type breakdown</div>' +
      '<div class="card breakdown">' + bars + '</div>' +
      '<div class="section-title">Month by month</div>' +
      '<div class="card month-table"><table><thead><tr><th>Month</th><th class="num">Hours worked</th><th class="num">Pay</th></tr></thead><tbody>' + monthRows + '</tbody></table></div>' +
      '<p class="footnote">Months are calendar months (1st\u2013last day), grouped from whatever dates are in All Data \u2014 add or import entries and this updates on its own.</p>';
  }

  function renderRangeBar() {
    var hasRange = !!(state.summaryFrom || state.summaryTo);
    var today = new Date();
    var presetValues = {
      all: { from: "", to: "" },
      year: { from: today.getFullYear() + "-01-01", to: "" },
      "3m": { from: isoDateFromParts(new Date(today.getFullYear(), today.getMonth() - 3, today.getDate())), to: "" },
      month: { from: today.getFullYear() + "-" + pad2(today.getMonth() + 1) + "-01", to: "" }
    };
    function isActive(name) {
      return presetValues[name].from === state.summaryFrom && presetValues[name].to === state.summaryTo;
    }
    function presetBtn(name, label) {
      return '<button class="btn btn-sm' + (isActive(name) ? ' btn-primary' : '') + '" data-preset="' + name + '">' + label + '</button>';
    }
    return '' +
      '<div class="log-toolbar" style="margin-bottom:18px;">' +
        '<div class="btn-row">' +
          presetBtn("all", "All time") +
          presetBtn("year", "This year") +
          presetBtn("3m", "Last 3 months") +
          presetBtn("month", "This month") +
        '</div>' +
        '<div class="filters">' +
          '<input type="date" id="sumFrom" class="field-input" value="' + escapeHtml(state.summaryFrom) + '">' +
          '<span style="color:var(--ink-dim);font-size:13px;align-self:center;">to</span>' +
          '<input type="date" id="sumTo" class="field-input" value="' + escapeHtml(state.summaryTo) + '">' +
          (hasRange ? '<button class="btn btn-sm" id="sumClear">Clear</button>' : '') +
        '</div>' +
      '</div>';
  }

  function renderEmpty() {
    return '<div class="card empty-state">' +
      '<div class="big">No entries logged yet</div>' +
      'Import your existing timesheet, or start logging days on the All Data tab.' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="emptyImport">Import spreadsheet</button>' +
        '<button class="btn" id="emptyAdd">Add first entry</button>' +
      '</div>' +
    '</div>';
  }

  function renderLog() {
    var entries = filteredEntries();
    var months = monthOptions();
    var monthSelect = '<option value="">All months</option>' + months.map(function (k) {
      return '<option value="' + k + '"' + (state.filterMonth === k ? " selected" : "") + '>' + monthLabel(k) + '</option>';
    }).join("");
    var typeSelect = '<option value="">All types</option>' + TYPES.map(function (t) {
      return '<option value="' + t + '"' + (state.filterType === t ? " selected" : "") + '>' + t + '</option>';
    }).join("");

    var toolbar = '' +
      '<div class="log-toolbar">' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="addBtn">+ Add entry</button>' +
          '<button class="btn" id="importBtn">Import</button>' +
          '<button class="btn" id="exportCsvBtn">Export CSV</button>' +
          '<button class="btn" id="exportXlsxBtn">Export Excel</button>' +
        '</div>' +
        '<div class="filters">' +
          '<select id="filterMonth">' + monthSelect + '</select>' +
          '<select id="filterType">' + typeSelect + '</select>' +
          '<button class="btn btn-sm" id="sortBtn">Date ' + (state.sortDir === "asc" ? "\u2191" : "\u2193") + '</button>' +
        '</div>' +
      '</div>';

    var formHtml = state.adding ? renderEntryForm(null) : "";

    if (!state.entries.length && !state.adding) {
      return toolbar + renderEmpty();
    }

    var selCount = entries.filter(function (e) { return isSelected(e.id); }).length;
    var allSelected = entries.length > 0 && selCount === entries.length;
    var bulkBar = selCount > 0 ? renderBulkBar(selCount) : "";

    var rows = entries.map(function (e) {
      if (state.editingId === e.id) return renderEntryFormRow(e);
      return renderRow(e);
    }).join("");

    return toolbar + bulkBar + formHtml +
      '<div class="card log-table-wrap"><table class="log-table"><thead><tr>' +
        '<th style="width:32px;"><input type="checkbox" id="selectAllChk"' + (allSelected ? " checked" : "") + '></th>' +
        '<th>Date</th><th>Start</th><th>End</th><th class="num">Break</th>' +
        '<th class="num">Hrs</th><th class="num">Hrs worked</th><th class="num">Rate</th><th class="num">Pay</th>' +
        '<th>Type</th><th>Notes</th><th></th>' +
      '</tr></thead><tbody>' + (rows || '<tr><td colspan="12" style="text-align:center;color:var(--ink-dim);padding:26px;">No entries match these filters.</td></tr>') + '</tbody></table></div>' +
      '<p class="footnote">' + entries.length + ' of ' + state.entries.length + ' entries shown. Data is saved in this browser only \u2014 export a copy from time to time.</p>';
  }

  function renderBulkBar(selCount) {
    var typeOpts = typeOptionsHtml("");
    var summaryRow = '<div class="btn-row" style="justify-content:space-between;">' +
      '<div class="btn-row"><b>' + selCount + '</b>&nbsp;selected</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-sm" id="bulkEditToggle">' + (state.bulkEditOpen ? "Hide edit fields" : "Edit selected") + '</button>' +
        '<button class="btn btn-sm btn-danger" id="bulkDelete">Delete selected</button>' +
        '<button class="btn btn-sm btn-ghost" id="bulkClear">Clear selection</button>' +
      '</div>' +
    '</div>';

    if (!state.bulkEditOpen) {
      return '<div class="card bulk-bar">' + summaryRow + '</div>';
    }

    function fieldRow(id, label, inputHtml) {
      return '<div class="bulk-field-row">' +
        '<label class="bulk-field-check"><input type="checkbox" class="bulk-field-on" id="' + id + '_on"> ' + label + '</label>' +
        inputHtml +
      '</div>';
    }

    var fields = '' +
      fieldRow("bulkType", "Type", '<select id="bulkType" class="field-input" disabled>' + typeOpts + '<option value="__clear__">(clear type)</option></select>') +
      fieldRow("bulkRate", "Rate (\u00a3/hr)", '<input type="number" step="0.01" min="0" id="bulkRate" class="field-input" disabled>') +
      fieldRow("bulkStart", "Start", '<input type="time" id="bulkStart" class="field-input" disabled>') +
      fieldRow("bulkEnd", "End", '<input type="time" id="bulkEnd" class="field-input" disabled>') +
      fieldRow("bulkBreak", "Break (hrs)", '<input type="number" step="0.25" min="0" id="bulkBreak" class="field-input" disabled>') +
      fieldRow("bulkNotes", "Notes", '<input type="text" id="bulkNotes" class="field-input" disabled>');

    return '<div class="card bulk-bar">' + summaryRow +
      '<div class="bulk-fields">' + fields + '</div>' +
      '<div class="btn-row" style="margin-top:10px;">' +
        '<button class="btn btn-primary btn-sm" id="bulkApplyFields">Apply to ' + selCount + ' entr' + (selCount === 1 ? "y" : "ies") + '</button>' +
      '</div>' +
    '</div>';
  }

  function renderRow(e) {
    var hours = computeHours(e), hw = computeHoursWorked(e), pay = computePay(e);
    var typeTag = e.type ? '<span class="tag ' + (TYPE_CLASS[e.type] || "tag-none") + '">' + escapeHtml(e.type) + '</span>' : '<span class="tag tag-none">\u2014</span>';
    var docCount = docsForDate(e.date).length;
    var docBadge = docCount > 0 ? ' <button class="doc-badge" data-goto-docs="' + e.date + '">\uD83D\uDCCE ' + docCount + '</button>' : '';
    return '<tr data-id="' + e.id + '">' +
      '<td><input type="checkbox" class="row-check" data-id="' + e.id + '"' + (isSelected(e.id) ? " checked" : "") + '></td>' +
      '<td class="mono">' + fmtDate(e.date) + docBadge + '</td>' +
      '<td class="mono">' + (e.start || "\u2014") + '</td>' +
      '<td class="mono">' + (e.end || "\u2014") + '</td>' +
      '<td class="num">' + (e.breakHrs === "" || e.breakHrs === undefined || e.breakHrs === null ? "\u2014" : e.breakHrs) + '</td>' +
      '<td class="num">' + fmtHours(hours) + '</td>' +
      '<td class="num">' + fmtHours(hw) + '</td>' +
      '<td class="num">' + (e.rate === "" || e.rate === undefined || e.rate === null || e.rate === "" ? "\u2014" : "\u00A3" + parseFloat(e.rate).toFixed(2)) + '</td>' +
      '<td class="num">' + fmtPay(pay) + '</td>' +
      '<td>' + typeTag + '</td>' +
      '<td class="notes-cell" title="' + escapeHtml(e.notes || "") + '">' + escapeHtml(e.notes || "") + '</td>' +
      '<td><div class="row-actions">' +
        '<button class="icon-btn" data-edit="' + e.id + '" title="Edit">Edit</button>' +
        '<button class="icon-btn danger" data-delete="' + e.id + '" title="Delete">Delete</button>' +
      '</div></td>' +
    '</tr>';
  }

  function typeOptionsHtml(selected) {
    return '<option value=""' + (!selected ? " selected" : "") + '>\u2014</option>' + TYPES.map(function (t) {
      return '<option value="' + t + '"' + (selected === t ? " selected" : "") + '>' + t + '</option>';
    }).join("");
  }

  function renderEntryForm(existing) {
    var e = existing || { date: "", start: "", end: "", breakHrs: "0.5", rate: state.lastRate || "", type: "Off", notes: "" };
    return '<div class="card entry-form" id="entryForm">' +
      '<div class="form-grid">' +
        '<div class="field"><label>Date</label><input type="date" id="f_date" value="' + escapeHtml(e.date) + '"></div>' +
        '<div class="field"><label>Start</label><input type="time" id="f_start" value="' + escapeHtml(e.start) + '"></div>' +
        '<div class="field"><label>End</label><input type="time" id="f_end" value="' + escapeHtml(e.end) + '"></div>' +
        '<div class="field"><label>Break (hrs)</label><input type="number" step="0.25" min="0" id="f_break" value="' + escapeHtml(e.breakHrs) + '"></div>' +
        '<div class="field"><label>Rate (\u00A3/hr)</label><input type="number" step="0.01" min="0" id="f_rate" value="' + escapeHtml(e.rate) + '"></div>' +
        '<div class="field"><label>Type</label><select id="f_type">' + typeOptionsHtml(e.type) + '</select></div>' +
        '<div class="field full"><label>Notes</label><input type="text" id="f_notes" value="' + escapeHtml(e.notes) + '" placeholder="Optional"></div>' +
      '</div>' +
      '<div class="form-preview" id="formPreview">' + formPreviewText(e) + '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="saveEntry" data-existing-id="' + (existing ? existing.id : "") + '">' + (existing ? "Save changes" : "Add entry") + '</button>' +
        '<button class="btn btn-ghost" id="cancelEntry">Cancel</button>' +
      '</div>' +
    '</div>';
  }

  function renderEntryFormRow(e) {
    return '<tr><td colspan="12" style="padding:0;border-bottom:none;">' + renderEntryForm(e) + '</td></tr>';
  }

  function formPreviewText(e) {
    var hours = computeHours(e), hw = computeHoursWorked(e), pay = computePay(e);
    return 'Hours: <b>' + fmtHours(hours) + '</b> &nbsp; Worked: <b>' + fmtHours(hw) + '</b> &nbsp; Pay: <b>' + fmtPay(pay) + '</b>';
  }

  function readFormValues() {
    return {
      date: document.getElementById("f_date").value,
      start: document.getElementById("f_start").value,
      end: document.getElementById("f_end").value,
      breakHrs: document.getElementById("f_break").value,
      rate: document.getElementById("f_rate").value,
      type: document.getElementById("f_type").value,
      notes: document.getElementById("f_notes").value.trim()
    };
  }

  /* ============ Events ============ */
  function attachGateEvents() {
    var submit = document.getElementById("gateSubmit");
    var input = document.getElementById("gatePin");
    if (submit) submit.addEventListener("click", function () { attemptLogin(input.value); });
    if (input) {
      input.focus();
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") attemptLogin(input.value);
      });
    }
  }

  function attachEvents() {
    var themeBtn = document.getElementById("themeToggle");
    if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

    bindIf("logoutBtn", "click", function () {
      if (confirm("Log out? You'll need your PIN again to view this timesheet on this device.")) logout();
    });

    document.querySelectorAll(".tab").forEach(function (btn) {
      btn.addEventListener("click", function () { state.tab = btn.getAttribute("data-tab"); render(); });
    });

    bindIf("addBtn", "click", function () { state.adding = true; state.editingId = null; render(); scrollToForm(); });
    bindIf("emptyAdd", "click", function () { state.tab = "log"; state.adding = true; render(); scrollToForm(); });
    bindIf("emptyImport", "click", function () { document.getElementById("fileInput").click(); });
    bindIf("importBtn", "click", function () { document.getElementById("fileInput").click(); });
    bindIf("exportCsvBtn", "click", exportCSV);
    bindIf("exportXlsxBtn", "click", exportXLSX);
    bindIf("sortBtn", "click", function () { state.sortDir = state.sortDir === "asc" ? "desc" : "asc"; render(); });
    bindIf("filterMonth", "change", function (ev) { state.filterMonth = ev.target.value; render(); });
    bindIf("filterType", "change", function (ev) { state.filterType = ev.target.value; render(); });
    bindIf("cancelEntry", "click", function () { state.adding = false; state.editingId = null; render(); });

    bindIf("sumFrom", "change", function (ev) { state.summaryFrom = ev.target.value; render(); });
    bindIf("sumTo", "change", function (ev) { state.summaryTo = ev.target.value; render(); });
    bindIf("sumClear", "click", function () { state.summaryFrom = ""; state.summaryTo = ""; render(); });
    document.querySelectorAll("[data-preset]").forEach(function (btn) {
      btn.addEventListener("click", function () { applyPreset(btn.getAttribute("data-preset")); });
    });

    var saveBtn = document.getElementById("saveEntry");
