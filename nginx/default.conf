# nginx for the timesheets and jobs static sites (same idea as Sky Spark's).
# HTTPS is done by Cloudflare (via the tunnel), so this only listens on http.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # For Coolify's health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Font files have a version in their names (.v1), so they can be cached for a year.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (HTML, JS, CSS, images): the names don't change between
    # deploys, so browsers and Cloudflare must check for a newer copy every time.
    # Unchanged files come back as a quick "not modified".
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
